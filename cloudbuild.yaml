# ─────────────────────────────────────────────────────────────
# Cloud Build — NourishAI API
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml .
#
# $BUILD_ID is always populated (manual + triggered builds).
# $SHORT_SHA is only populated by repo-connected triggers.
# ─────────────────────────────────────────────────────────────

substitutions:
  _REGION: us-central1
  _SERVICE: nourishai-api
  _REPO: nourishai

steps:
  # ── 1. Build the Docker image ───────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build
    args:
      - build
      - --tag
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID"
      - --tag
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest"
      - --cache-from
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest"
      - --file
      - Dockerfile
      - .

  # ── 2. Push image to Artifact Registry ─────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: push
    waitFor: [build]
    args:
      - push
      - --all-tags
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"

  # ── 3. Deploy to Cloud Run ─────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy
    waitFor: [push]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=3001
      - --min-instances=0
      - --max-instances=5
      - --memory=512Mi
      - --cpu=1
      - --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest
      - --set-env-vars=NODE_ENV=production,FRONTEND_ORIGIN=https://$PROJECT_ID.web.app

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 900s
